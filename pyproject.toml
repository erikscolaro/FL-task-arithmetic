# =====================================================================
# Federated Learning with Task Arithmetic - Configuration File
# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

# =====================================================================
# Build System Configuration
# =====================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =====================================================================
# Project Metadata
# =====================================================================
[project]
name = "fl-task-arithmetic"
version = "1.0.0"
description = "Federated Learning with Task Arithmetic and Sparse Fine-tuning"
license = "Apache-2.0"

dependencies = [
    "flwr[simulation]>=1.23.0",         # Flower federated learning framework
    "flwr-datasets[vision]>=0.5.0",     # Flower datasets with vision utilities
    "torch==2.7.1",                     # PyTorch deep learning framework
    "torchvision==0.22.1",              # PyTorch vision utilities
    "wandb>=0.17.8",                    # Weights & Biases for experiment tracking
]

[tool.hatch.build.targets.wheel]
packages = ["."]

# =====================================================================
# Flower Application Configuration
# =====================================================================
[tool.flwr.app]
publisher = "erik"

[tool.flwr.app.components]
serverapp = "fl_task_arithmetic.server_app:app"
clientapp = "fl_task_arithmetic.client_app:app"

# =====================================================================
# Federated Learning Configuration
# =====================================================================
[tool.flwr.app.config]

# --- Server Configuration ---
num-server-rounds = 60                  # Number of federated learning rounds
fraction-train = 0.1                    # Fraction of clients selected for training each round
fraction-evaluate = 0.2                 # Fraction of clients selected for evaluation each round
server-checkpoint-interval = 1          # Save server model checkpoint every N rounds

# --- Client Training Configuration ---
local-epochs = 8                        # Number of local training epochs per round
lr = 0.0001                             # Learning rate for client optimization
client-batch-size = 64                  # Batch size for client training and evaluation

# --- Data Partitioning Configuration ---
# Controls how data is distributed across clients (IID vs non-IID)
num-classes-per-partition = 20          # Number of classes per client partition
                                        # - 1: Extreme non-IID (each client has only 1 class)
                                        # - 100: IID (each client has samples from all classes)
                                        # - 20: Moderate non-IID (balanced heterogeneity)

client-test-ratio-of-partition = 0.1    # Fraction of each client's partition used for local testing
                                        # Example: with 5k images per client, 0.1 creates:
                                        # - 4.5k training images
                                        # - 500 test images

# --- Sparse Fine-tuning Configuration ---
use-sparse-finetuning = true            # Enable gradient masking for sparse parameter updates
sparsity-ratio = 0.9                    # Fraction of parameters to freeze during training
                                        # - 0.0: No sparsity (all parameters trainable)
                                        # - 0.9: 90% of parameters frozen, 10% trainable
                                        # - 0.95: 95% frozen (more aggressive sparsity)

num-calibration-rounds = 5              # Number of iterative rounds for mask calibration
num-batches-calibration = 150            # Batches per calibration round (-1 = use all batches)
mask-calibration-type = 0               # Type of mask calibration strategy
                                        # - 0: Task arithmetic based calibration
                                        # - 1: Most sensitive parameters
                                        # - 2: Random masking

# =====================================================================
# Weights & Biases (Experiment Tracking) Configuration
# =====================================================================
entity = "aml-fl-project"               # W&B entity (team or username)
project = "fl-task-arithmetic"          # W&B project name
group = "experiment-1"                  # W&B run group for organizing experiments
notes = "Federated learning with Flower and CIFAR100"
run_id = 0                              # Unique identifier for this experimental run

# Resume behavior for interrupted runs:
#   - "allow": Resume if run ID exists, otherwise start new run
#   - "must": Only resume existing run, error if not found
#   - "never": Always start fresh run, ignore existing run ID
resume = "allow"

# =====================================================================
# Federation Configuration (Simulation Setup)
# =====================================================================
[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 100                       # Number of virtual clients in simulation
options.backend.client-resources.num-cpus = 1      # CPU cores allocated per client (default: 2)
options.backend.client-resources.num-gpus = 1      # GPU allocation per client (1.0 = 100% of GPU)
